<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Livro-caixa do condomínio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#18262a;--muted:#5b6b6e;--line:#d3dcdc;--in:#1b6b57;--out:#a33b2b;--btn:#17525f;--btnink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1819;--card:#172426;--ink:#e6eeee;--muted:#93a5a7;--line:#2a3b3d;--in:#5cc2a5;--out:#ef8f7d;--btn:#7cc7d6;--btnink:#0f1819;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1819;--card:#172426;--ink:#e6eeee;--muted:#93a5a7;--line:#2a3b3d;--in:#5cc2a5;--out:#ef8f7d;--btn:#7cc7d6;--btnink:#0f1819;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Hanken Grotesk",system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:1.05rem;margin:28px 0 10px}
.sub{color:var(--muted);margin:0 0 18px;font-size:.92rem}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px;min-height:44px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--btn);outline-offset:2px}
.bar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:16px}
.bar>div{flex:1;min-width:150px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 16px}
.sum div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.sum div:last-child{border:0;padding:14px 0 10px;font-weight:700;font-size:1.5rem}
.in{color:var(--in)}.out{color:var(--out)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;border:0;background:var(--card);color:var(--ink);font:inherit;padding:11px;min-height:44px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btnink);font-weight:700}
form{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.g .full{grid-column:1/-1}
@media (max-width:480px){.g{grid-template-columns:1fr}}
.btn{background:var(--btn);color:var(--btnink);border:0;border-radius:6px;font:inherit;font-weight:700;padding:11px 18px;min-height:44px;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.row{display:grid;grid-template-columns:62px 1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.row small{color:var(--muted)}
.row .v{font-weight:700;text-align:right}
.row .del{grid-column:3;justify-self:end;background:none;border:0;color:var(--muted);font:inherit;font-size:.82rem;cursor:pointer;padding:4px 0;min-height:32px}
.cat{display:grid;grid-template-columns:140px 1fr 96px;gap:10px;align-items:center;padding:5px 0;font-size:.92rem}
.cat i{display:block;height:8px;background:var(--out);border-radius:4px;opacity:.75}
.cat span:last-child{text-align:right}
.empty{color:var(--muted);padding:18px 0}
#msg{color:var(--out);font-size:.9rem;min-height:1.2em;margin:8px 0 0}
.note{font-size:.82rem;color:var(--muted);margin-top:24px}
</style>
</head>
<body>
<main>
<h1>Livro-caixa do condomínio</h1>
<p class="sub">Registre receitas e despesas, e veja o fechamento de cada mês.</p>

<div class="bar">
  <div><label for="mes">Mês</label><input type="month" id="mes"></div>
  <button class="btn alt" id="csv" hidden>Exportar planilha (CSV)</button>
</div>

<section class="sum" aria-label="Fechamento do mês">
  <div><span>Saldo anterior</span><span id="s-ant"></span></div>
  <div><span>Entradas</span><span id="s-in" class="in"></span></div>
  <div><span>Saídas</span><span id="s-out" class="out"></span></div>
  <div><span>Saldo final</span><span id="s-fim"></span></div>
</section>

<h2>Novo lançamento</h2>
<form id="f" autocomplete="off">
  <div class="seg" role="group" aria-label="Tipo de lançamento">
    <button type="button" data-t="despesa" aria-pressed="true">Despesa</button>
    <button type="button" data-t="receita" aria-pressed="false">Receita</button>
  </div>
  <div class="g">
    <div><label for="data">Data</label><input type="date" id="data" required></div>
    <div><label for="valor">Valor (R$)</label><input id="valor" inputmode="decimal" placeholder="0,00" required></div>
    <div class="full"><label for="desc">Fornecedor ou descrição</label><input id="desc" required maxlength="120"></div>
    <div><label for="cat">Categoria</label><select id="cat"></select></div>
    <div><label for="nota">Nº da nota (opcional)</label><input id="nota" maxlength="40"></div>
    <div class="full"><label for="obs">Observação (opcional)</label><input id="obs" maxlength="200"></div>
  </div>
  <button class="btn" type="submit">Salvar lançamento</button>
  <p id="msg" role="status"></p>
</form>

<h2>Lançamentos do mês</h2>
<div id="lista"></div>

<h2>Despesas por categoria</h2>
<div id="cats"></div>

<p class="note" id="aviso"></p>
</main>
<script>
const BRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const CATS = {
  despesa:['Água e esgoto','Energia das áreas comuns','Manutenção e reparos','Limpeza','Gás','Seguro','Taxas e impostos','Honorários','Obras','Outras despesas'],
  receita:['Taxa condominial','Rateio de água','Multa e juros','Fundo de reserva','Outras receitas']
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hoje = new Date().toISOString().slice(0,10);
let tipo = 'despesa', rows = [], store = null, downloads = null, pend = null;

function parseBRL(s){
  s = String(s).trim().replace(/[R$\s]/g,'');
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  const n = Number(s);
  return Number.isFinite(n) ? Math.round(n*100)/100 : NaN;
}
const dataBR = d => d.slice(8,10) + '/' + d.slice(5,7);

function fillCats(){
  $('cat').innerHTML = CATS[tipo].map(c => '<option>' + esc(c) + '</option>').join('');
}

function render(){
  const mes = $('mes').value;
  const ini = mes + '-01';
  const doMes = rows.filter(r => r.data.startsWith(mes)).sort((a,b) => b.data.localeCompare(a.data));
  const soma = (arr,t) => arr.filter(r => r.tipo === t).reduce((s,r) => s + r.valor, 0);
  const antes = rows.filter(r => r.data < ini);
  const ant = soma(antes,'receita') - soma(antes,'despesa');
  const ent = soma(doMes,'receita'), sai = soma(doMes,'despesa'), fim = ant + ent - sai;
  $('s-ant').textContent = BRL.format(ant);
  $('s-in').textContent = BRL.format(ent);
  $('s-out').textContent = BRL.format(sai);
  $('s-fim').textContent = BRL.format(fim);
  $('s-fim').className = fim < 0 ? 'out' : '';

  $('lista').innerHTML = doMes.length ? doMes.map(r =>
    '<div class="row"><span>' + dataBR(r.data) + '</span><span>' + esc(r.desc) +
    '<br><small>' + esc(r.cat) + (r.nota ? ' · nota ' + esc(r.nota) : '') + (r.obs ? ' · ' + esc(r.obs) : '') + '</small></span>' +
    '<span class="v ' + (r.tipo === 'receita' ? 'in' : 'out') + '">' + (r.tipo === 'receita' ? '+ ' : '− ') + BRL.format(r.valor) + '</span>' +
    '<button class="del" data-id="' + esc(r.id) + '">' + (pend === r.id ? 'Confirmar exclusão' : 'Excluir') + '</button></div>'
  ).join('') : '<p class="empty">Nenhum lançamento neste mês. Use o formulário acima para registrar o primeiro.</p>';

  const por = {};
  doMes.filter(r => r.tipo === 'despesa').forEach(r => por[r.cat] = (por[r.cat] || 0) + r.valor);
  const lista = Object.entries(por).sort((a,b) => b[1] - a[1]);
  $('cats').innerHTML = lista.length ? lista.map(([c,v]) =>
    '<div class="cat"><span>' + esc(c) + '</span><span><i style="width:' + Math.max(3, v/sai*100) + '%"></i></span><span>' + BRL.format(v) + '</span></div>'
  ).join('') : '<p class="empty">Sem despesas neste mês.</p>';
}

function csv(){
  const mes = $('mes').value;
  const linhas = rows.filter(r => r.data.startsWith(mes)).sort((a,b) => a.data.localeCompare(b.data));
  const q = s => '"' + String(s ?? '').replace(/"/g,'""') + '"';
  const out = ['Data;Tipo;Categoria;Descrição;Nota;Valor;Observação'].concat(linhas.map(r =>
    [r.data.split('-').reverse().join('/'), r.tipo, q(r.cat), q(r.desc), q(r.nota), String(r.valor.toFixed(2)).replace('.',','), q(r.obs)].join(';')));
  return '\ufeff' + out.join('\r\n');
}

function aviso(t){ $('aviso').textContent = t; }

async function init(){
  $('mes').value = hoje.slice(0,7);
  $('data').value = hoje;
  fillCats();
  let db = null;
  try { db = window.claude ? await window.claude.use('db') : null; } catch(e) {}
  try { downloads = window.claude ? await window.claude.use('downloads') : null; } catch(e) {}
  if (downloads) $('csv').hidden = false;
  if (db) {
    const col = db.collection('lancamentos');
    col.onSnapshot(s => { rows = s.docs.map(d => ({id: d.id, ...d.data()})); render(); },
      e => aviso('Não foi possível ler os dados: ' + e.message));
    store = { add: o => col.add(o), del: id => db.doc('lancamentos/' + id).delete() };
    aviso('Os lançamentos ficam salvos no próprio app e aparecem em todos os seus aparelhos.');
  } else {
    const k = 'lancamentos-condominio';
    const ler = () => { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch(e) { return []; } };
    const gravar = a => { try { localStorage.setItem(k, JSON.stringify(a)); } catch(e) {} rows = a; render(); };
    rows = ler();
    store = { add: async o => gravar(ler().concat([{...o, id: String(Date.now())}])), del: async id => gravar(ler().filter(r => r.id !== id)) };
    aviso('Modo local: os lançamentos ficam salvos só neste navegador.');
  }
  render();
}

document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  tipo = b.dataset.t;
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  fillCats();
}));
$('mes').addEventListener('change', render);
$('csv').addEventListener('click', async () => {
  try { await downloads.save({filename: 'livro-caixa-' + $('mes').value + '.csv', data: csv()}); }
  catch(e) { if (e && e.code !== 'declined') aviso('Não foi possível exportar a planilha.'); }
});
$('lista').addEventListener('click', async e => {
  const b = e.target.closest('.del'); if (!b) return;
  const id = b.dataset.id;
  if (pend !== id) { pend = id; render(); setTimeout(() => { if (pend === id) { pend = null; render(); } }, 4000); return; }
  pend = null;
  try { await store.del(id); } catch(err) { aviso('Não foi possível excluir: ' + err.message); }
});
$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const valor = parseBRL($('valor').value), desc = $('desc').value.trim();
  if (!desc) { $('msg').textContent = 'Informe o fornecedor ou a descrição.'; return; }
  if (!(valor > 0)) { $('msg').textContent = 'Informe um valor maior que zero, por exemplo 1.250,00.'; return; }
  $('msg').textContent = '';
  try {
    await store.add({tipo, data: $('data').value, valor, desc, cat: $('cat').value, nota: $('nota').value.trim(), obs: $('obs').value.trim()});
    $('mes').value = $('data').value.slice(0,7);
    ['valor','desc','nota','obs'].forEach(id => $(id).value = '');
    $('msg').style.color = 'var(--in)'; $('msg').textContent = 'Lançamento salvo.';
    setTimeout(() => { $('msg').textContent = ''; $('msg').style.color = ''; }, 2500);
    render();
  } catch(err) { $('msg').textContent = 'Não foi possível salvar: ' + err.message; }
});
init();
</script>
</body>
</html>
