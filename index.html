<style>
:root{--bg:#f2f5f4;--card:#fff;--ink:#17282b;--muted:#627477;--line:#dce5e3;--brand:#17525f;--brand2:#dcefee;--green:#197453;--red:#a63d31;--amber:#8a5b10;--shadow:0 4px 18px #1d37380b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:18px;padding:0 8px}.brandmark{width:38px;height:38px;border-radius:12px;background:var(--brand);color:white;display:grid;place-items:center;font-size:20px}.side small{color:var(--muted)}.navgroup{display:grid;gap:5px}.navlabel{font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:.09em;color:#839294;padding:0 10px 6px}.nav{display:flex;gap:11px;align-items:center;border:0;background:transparent;color:#526466;text-align:left;border-radius:10px;padding:11px 12px}.nav.active,.nav:hover{background:var(--brand2);color:var(--brand);font-weight:700}.nav .ico{width:20px;text-align:center}.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding:16px 8px;color:var(--muted);font-size:12px}.main{min-width:0}.top{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:15px}.crumb{font-size:13px;color:var(--muted)}.topright{display:flex;align-items:center;gap:12px}.rolebox{border:1px solid var(--line);border-radius:9px;padding:8px;background:#fff;color:var(--ink);max-width:220px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--brand2);color:var(--brand);font-weight:800}.content{padding:30px;max-width:1400px;margin:auto}.heading{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:24px}.eyebrow{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}.heading h1{font-size:28px;letter-spacing:-.04em;margin:5px 0}.heading p{margin:0;color:var(--muted)}.btn{border:0;border-radius:9px;background:var(--brand);color:white;padding:10px 15px;font-weight:700}.btn.secondary{background:white;border:1px solid var(--line);color:var(--ink)}.btn:disabled{opacity:.5;cursor:not-allowed}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);min-width:0}.statlabel{color:var(--muted);font-size:13px}.statval{font-size:25px;font-weight:800;letter-spacing:-.035em;margin:8px 0 3px}.statnote{font-size:12px;color:var(--muted)}.positive{color:var(--green)}.negative{color:var(--red)}.cols{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr)}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.cardhead h2{font-size:16px;margin:0}.linkbtn{border:0;background:none;color:var(--brand);font-weight:700;padding:4px}.list{display:grid;gap:0}.listrow{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border-bottom:0}.doticon{width:38px;height:38px;flex:0 0 38px;border-radius:11px;background:var(--brand2);display:grid;place-items:center}.rowtitle{font-weight:700}.rowmeta{font-size:12px;color:var(--muted);margin-top:3px}.rowright{margin-left:auto;text-align:right;white-space:nowrap;font-weight:750}.pill{display:inline-block;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:750;background:#edf2f1;color:#526466}.pill.green{background:#e0f4e9;color:#176641}.pill.amber{background:#fff0d4;color:#8a5b10}.pill.red{background:#fde9e6;color:#a63d31}.sectiongrid{grid-template-columns:repeat(3,minmax(0,1fr))}.modulecard{padding:20px;min-height:145px;cursor:pointer;transition:transform .15s,border-color .15s}.modulecard:hover{transform:translateY(-2px);border-color:#9bbfbc}.moduleicon{width:42px;height:42px;display:grid;place-items:center;background:var(--brand2);border-radius:12px;font-size:21px;margin-bottom:15px}.modulecard h3{margin:0 0 5px;font-size:16px}.modulecard p{margin:0;color:var(--muted);font-size:13px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}.field{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 12px;min-height:42px;color:var(--ink)}.field.grow{flex:1;min-width:190px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:680px}th{text-align:left;color:var(--muted);font-size:12px;font-weight:700;padding:12px;border-bottom:1px solid var(--line)}td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:middle}tbody tr:last-child td{border-bottom:0}.amount{text-align:right;white-space:nowrap;font-weight:750}.muted{color:var(--muted)}.notice{padding:12px 14px;background:#eef6f5;border:1px solid #d6e9e6;border-radius:10px;color:#315d5b;font-size:13px;margin-bottom:16px}.empty{padding:35px;text-align:center;color:var(--muted)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.formgrid label{display:grid;gap:6px;color:var(--muted);font-size:13px}.formgrid .full{grid-column:1/-1}.hide{display:none!important}.mobilehead{display:none}.smallnote{font-size:12px;color:var(--muted);margin-top:12px}.footerline{font-size:12px;color:var(--muted);margin-top:20px}

<body><div id="authgate" class="authgate"><div class="authcard"><p class="agsub">Carregando…</p></div></div><div class="layout"><aside class="side"><div class="brand"><div class="brandmark">⌂</div><div>Condomínio<span style="display:block;font-size:11px;font-weight:500;color:var(--muted)">Gestão simplificada</span></div></div><div class="navgroup"><div class="navlabel">Visão geral</div><button class="nav active" data-page="inicio"><span class="ico">▦</span>Início</button></div><div class="navgroup"><div class="navlabel">Administração</div><button class="nav" data-page="financeiro"><span class="ico">◫</span>Financeiro</button><button class="nav" data-page="cobranca"><span class="ico">⊞</span>Cobrança mensal</button><button class="nav" data-page="boletos"><span class="ico">▥</span>Boletos (teste)</button><button class="nav" data-page="avisos"><span class="ico">◉</span>Avisos</button><button class="nav" data-page="documentos"><span class="ico">▤</span>Documentos</button><button class="nav" data-page="ocorrencias"><span class="ico">⚒</span>Ocorrências</button><button class="nav" data-page="manutencoes"><span class="ico">◷</span>Manutenções</button><button class="nav" data-page="reservas"><span class="ico">▦</span>Vaga visitante</button><button class="nav" data-page="enquetes"><span class="ico">☷</span>Enquetes</button><button class="nav hide" id="navconvites" data-page="convites"><span class="ico">✉</span>Convites</button></div><div class="sidefoot">Versão 1.8.1 · demonstração<br>Dados fictícios · sem conexão com banco</div></aside>
<main class="main"><header class="top"><div><div class="mobilehead"><span class="brandmark">⌂</span> Condomínio</div><div class="crumb" id="crumb">Visão geral / Início</div></div><div class="topright"><label class="muted" for="role" style="font-size:12px">Visualizar perfil</label><select class="rolebox" id="role" aria-label="Perfil de demonstração"><option value="sindico">Síndico · administrador</option><option value="conselho">Conselho · consulta</option><option value="morador">Morador · consulta</option></select><div class="avatar" id="avatar">S</div></div></header><div class="content" id="content"></div></main></div><nav class="bottomnav"><button class="active" data-page="inicio"><span>▦</span>Início</button><button data-page="financeiro"><span>◫</span>Financeiro</button><button data-page="avisos"><span>◉</span>Avisos</button><button data-page="menu"><span>☰</span>Menu</button></nav>

<script>
const brl=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n);const today=new Date();const iso=today.toISOString().slice(0,10);let page='inicio',role='sindico';
let entries=[{id:1,date:iso,type:'despesa',desc:'Manutenção do portão',cat:'Manutenção e reparos',value:420,note:'OS 024',obs:''},{id:2,date:iso.slice(0,8)+'05',type:'receita',desc:'Taxa condominial — unidade 101',cat:'Taxa condominial',value:650,note:'',obs:''},{id:3,date:iso.slice(0,8)+'03',type:'despesa',desc:'Energia das áreas comuns',cat:'Energia das áreas comuns',value:186.4,note:'',obs:''},{id:4,date:iso.slice(0,8)+'02',type:'receita',desc:'Taxa condominial — unidade 102',cat:'Taxa condominial',value:650,note:'',obs:''}];
const notices=[{title:'Limpeza da caixa d’água',date:'Publicado hoje',text:'Serviço programado para sábado, das 9h às 12h.'},{title:'Revisão do portão',date:'Publicado há 2 dias',text:'Técnico realizará manutenção preventiva.'},{title:'Reunião do condomínio',date:'Publicado há 5 dias',text:'Pauta e horário serão divulgados em breve.'}];
const docs=[['Convenção do condomínio','Institucional · PDF'],['Regimento interno','Institucional · PDF'],['Prestação de contas — mês anterior','Financeiro · Relatório'],['Apólice do seguro predial','Contratos e seguros · PDF']];
let occurrences=[{title:'Lâmpada queimada no corredor do 2º andar',unit:'Unidade 203',status:'Aberta',tone:'amber'},{title:'Portão com ruído durante abertura',unit:'Unidade 101',status:'Em andamento',tone:'green'}];
let visitorNotices=[{id:1,date:iso,start:'14:00',end:'18:00',unit:'Unidade 102',note:'Visita familiar',status:'Aviso ativo'}];
const dateOffset=(days)=>{const d=new Date();d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)};
let maintenanceTasks=[{id:1,title:'Limpeza da caixa de gordura',category:'Limpeza e saneamento',due:dateOffset(12),interval:3,responsible:'Síndico',provider:'A definir',notes:'Confirmar periodicidade adequada com prestador e condições do condomínio.',status:'Agendada',history:[]},{id:2,title:'Limpeza e desinfecção da caixa d’água',category:'Reservatório de água',due:dateOffset(30),interval:6,responsible:'Síndico',provider:'A definir',notes:'Confirmar frequência aplicável e guardar comprovante/relatório do serviço.',status:'Agendada',history:[]},{id:3,title:'Inspeção/manutenção dos extintores',category:'Segurança contra incêndio',due:dateOffset(45),interval:12,responsible:'Síndico',provider:'Empresa habilitada',notes:'A periodicidade e o tipo de serviço devem seguir validade, fabricante e exigências locais aplicáveis.',status:'Agendada',history:[]},{id:4,title:'Revisão preventiva do portão',category:'Equipamentos',due:dateOffset(60),interval:6,responsible:'Síndico',provider:'A definir',notes:'Verificar funcionamento, sensores e itens de segurança.',status:'Agendada',history:[]}];
const labels={inicio:'Início',financeiro:'Financeiro',cobranca:'Cobrança mensal',boletos:'Boletos (teste)',avisos:'Avisos',documentos:'Documentos',ocorrencias:'Ocorrências',manutencoes:'Manutenções',reservas:'Vaga visitante',enquetes:'Enquetes',convites:'Convites',menu:'Menu'};
const isAdmin=()=>role==='sindico';const isCouncil=()=>role==='conselho';const canFullFinance=()=>role==='sindico'||role==='conselho';
function head(title,sub,button=''){return `<div class="heading"><div><div class="eyebrow">Gestão condominial</div><h1>${title}</h1><p>${sub}</p></div>${button}</div>`}
function cardStat(label,val,note,cls=''){return `<div class="card"><div class="statlabel">${label}</div><div class="statval ${cls}">${val}</div><div class="statnote">${note}</div></div>`}
function navCard(icon,title,desc,target){return `<div class="card modulecard" tabindex="0" role="button" data-go="${target}"><div class="moduleicon">${icon}</div><h3>${title}</h3><p>${desc}</p></div>`}
function dashboard(){const inc=entries.filter(e=>e.type==='receita').reduce((s,e)=>s+e.value,0),out=entries.filter(e=>e.type==='despesa').reduce((s,e)=>s+e.value,0);return `${head('Bom dia 👋','Acompanhe as informações importantes do condomínio.')}
<div class="grid stats">${window.APP&&APP.on?'':`${cardStat('Saldo demonstrativo',brl(5240+inc-out),'Saldo ilustrativo para esta demonstração')}${cardStat('Receitas registradas',brl(inc),'Lançamentos de exemplo','positive')}${cardStat('Despesas registradas',brl(out),'Lançamentos de exemplo','negative')}`}${cardStat('Ocorrências pendentes',String(occurrences.filter(o=>o.status!=='Concluída').length),'Acompanhe as solicitações')}${window.APP&&APP.on?cardStat('Avisos recentes',String(notices.length),'Comunicados do condomínio'):''}</div>
<div class="grid cols"><section class="card"><div class="cardhead"><h2>Atalhos</h2></div><div class="grid sectiongrid">${navCard('◫','Financeiro','Consultar movimentações','financeiro')}${navCard('◉','Avisos','Comunicados recentes','avisos')}${navCard('▤','Documentos','Arquivos do condomínio','documentos')}${navCard('⚒','Ocorrências','Solicitações e manutenção','ocorrencias')}${navCard('◷','Manutenções','Calendário preventivo e alertas','manutencoes')}${navCard('▦','Vaga visitante','Avisar os moradores sobre o uso','reservas')}${navCard('☷','Enquetes','Consultas aos moradores','enquetes')}</div></section><section class="card"><div class="cardhead"><h2>Avisos recentes</h2><button class="linkbtn" data-go="avisos">Ver todos →</button></div><div class="list">${notices.slice(0,3).map(n=>`<div class="listrow"><div class="doticon">◉</div><div><div class="rowtitle">${n.title}</div><div class="rowmeta">${n.date}</div><div class="rowmeta">${n.text}</div></div></div>`).join('')}</div></section></div><div class="footerline">Demonstração com dados fictícios. Não utilize para registrar movimentações reais.</div>`}
function finance(){const totalIn=entries.filter(e=>e.type==='receita').reduce((s,e)=>s+e.value,0),totalOut=entries.filter(e=>e.type==='despesa').reduce((s,e)=>s+e.value,0);const full=canFullFinance();return `${head('Financeiro',full?'Livro-caixa detalhado para consulta e administração.':'Resumo da prestação de contas do condomínio.',isAdmin()?'<button class="btn" id="newentry">＋ Novo lançamento</button>':'')}
<div class="notice">${isAdmin()?'Perfil administrador: pode registrar lançamentos nesta demonstração.':'Modo de consulta: não é permitido editar, exportar ou baixar dados financeiros.'} Os valores exibidos são fictícios.</div>
<div class="grid stats">${cardStat(full?'Entradas registradas':'Receitas do período',brl(totalIn),'Valores de exemplo','positive')}${cardStat(full?'Saídas registradas':'Despesas do período',brl(totalOut),'Valores de exemplo','negative')}${cardStat('Saldo do período',brl(totalIn-totalOut),'Entradas menos saídas')}${cardStat('Lançamentos',String(entries.length),'Registros de demonstração')}</div>
<div class="card"><div class="toolbar"><input class="field grow" id="searchEntry" placeholder="Pesquisar descrição ou categoria"><select class="field" id="filterType"><option value="todos">Todas as movimentações</option><option value="receita">Receitas</option><option value="despesa">Despesas</option></select><input class="field" id="filterMonth" type="month" value="${iso.slice(0,7)}"></div><div id="financeTable">${financeTable(entries)}</div><div class="smallnote">Conselho: consulta detalhada dentro do aplicativo, sem exportação/download. Moradores: somente resumo financeiro.</div></div>`}
function financeTable(list){if(role==='morador'){const inc=list.filter(e=>e.type==='receita').reduce((s,e)=>s+e.value,0),out=list.filter(e=>e.type==='despesa').reduce((s,e)=>s+e.value,0);return `<div class="grid stats">${cardStat('Total de receitas',brl(inc),'Período selecionado','positive')}${cardStat('Total de despesas',brl(out),'Período selecionado','negative')}</div><p class="muted">O perfil de morador não exibe lançamentos individuais nem comprovantes.</p>`}if(!list.length)return '<div class="empty">Nenhum lançamento encontrado para os filtros selecionados.</div>';return `<div class="tablewrap"><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Tipo</th><th class="amount">Valor</th>${isAdmin()?'<th>Ação</th>':''}</tr></thead><tbody>${list.map(e=>`<tr><td>${e.date.split('-').reverse().join('/')}</td><td><strong>${e.desc}</strong>${e.note?`<div class="rowmeta">Documento: ${e.note}</div>`:''}</td><td>${e.cat}</td><td><span class="pill ${e.type==='receita'?'green':'red'}">${e.type==='receita'?'Receita':'Despesa'}</span></td><td class="amount ${e.type==='receita'?'positive':'negative'}">${e.type==='receita'?'+':'−'} ${brl(e.value)}</td>${isAdmin()?`<td><button class="linkbtn" data-del="${e.id}">Estornar</button></td>`:''}</tr>`).join('')}</tbody></table></div>`}

function maintenancePage(){if(role==='morador')return `${head('Manutenções','Este calendário é destinado ao síndico e ao conselho.')}<div class="notice">Acesso restrito aos perfis de síndico e conselho.</div>`;const sorted=[...maintenanceTasks].sort((a,b)=>a.due.localeCompare(b.due));const active=sorted.filter(t=>t.status!=='Concluída');const overdue=active.filter(t=>t.due<iso).length;const soon=active.filter(t=>t.due>=iso&&t.due<=dateOffset(30)).length;const fmt=d=>d.split('-').reverse().join('/');const status=t=>t.status==='Concluída'?['Concluída','green']:t.due<iso?['Atrasada','red']:t.due<=dateOffset(30)?['Próxima','amber']:['Agendada','green'];return `${head('Calendário de manutenções','Planejamento preventivo, alertas e histórico de execução.',isAdmin()?'<button class="btn" id="newmaintenance">＋ Agendar manutenção</button>':'')}<div class="notice">Os intervalos exibidos são exemplos editáveis, não uma declaração de periodicidade legal. Para extintores e sistemas de segurança, confirme prazos e serviços com empresa habilitada e exigências locais. Os alertas deste protótipo aparecem dentro do aplicativo; notificações externas ainda não estão configuradas.</div><div class="grid stats">${cardStat('Manutenções em aberto',String(active.length),'Tarefas ainda não concluídas')}${cardStat('Vencidas',String(overdue),'Exigem avaliação',overdue?'negative':'')}${cardStat('Próximos 30 dias',String(soon),'Preparar contratação')}${cardStat('Recorrentes',String(maintenanceTasks.filter(t=>t.interval>0).length),'Com periodicidade definida')}</div><div class="card"><div class="cardhead"><h2>Agenda preventiva</h2><span class="pill">Ordenada por vencimento</span></div><div class="list">${sorted.map(t=>{const st=status(t);return `<div class="listrow"><div class="doticon">◷</div><div style="flex:1;min-width:0"><div class="rowtitle">${t.title}</div><div class="rowmeta">Vencimento: ${fmt(t.due)} · Recorrência: ${t.interval?('a cada '+t.interval+' meses'):'única'}</div><div class="rowmeta">Responsável: ${t.responsible} · Prestador: ${t.provider||'A definir'}</div><div class="rowmeta">${t.notes||''}</div>${t.history.length?`<div class="rowmeta">Última execução: ${fmt(t.history[t.history.length-1].date)}${t.history[t.history.length-1].note?' · '+t.history[t.history.length-1].note:''}</div>`:''}</div><div class="rowright"><span class="pill ${st[1]}">${st[0]}</span>${isAdmin()&&t.status!=='Concluída'?`<div><button class="linkbtn" data-done-maint="${t.id}">Registrar execução</button></div><div><button class="linkbtn" data-edit-maint="${t.id}">Editar</button></div>`:''}</div></div>`}).join('')||'<div class="empty">Nenhuma manutenção cadastrada.</div>'}</div></div><p class="smallnote">Cada execução deverá registrar data, responsável, observações e documentos comprobatórios. Na versão conectada, os anexos ficarão em armazenamento privado e poderão ser vinculados ao lançamento financeiro correspondente.</p>`}

nclick=()=>{const v=document.querySelector('input[name="poll"]:checked');document.getElementById('votemsg').textContent=v?'Resposta registrada apenas nesta demonstração.':'Selecione uma opção.'};const nn=document.getElementById('newnotice');if(nn)nn.onclick=()=>{const title=prompt('Título do aviso:');if(title?.trim()){notices.unshift({title:title.trim(),date:'Publicado agora',text:prompt('Texto do aviso:')||''});render()}};const nd=document.getElementById('newdoc');if(nd)nd.onclick=()=>alert('Na versão conectada, o síndico poderá anexar o arquivo ao armazenamento seguro.');const np=document.getElementById('newpoll');if(np)np.onclick=()=>alert('Cadastro de enquete será conectado ao banco na etapa de implementação do módulo.');}

function showEntryForm(){if(!isAdmin())return;const c=document.getElementById('content');c.insertAdjacentHTML('afterbegin',`<div class="card" id="entryform" style="margin-bottom:18px"><div class="cardhead"><h2>Novo lançamento</h2><button class="linkbtn" id="closeform">Fechar ×</button></div><form id="entryformdata" class="formgrid"><label>Tipo<select class="field" name="type"><option value="despesa">Despesa</option><option value="receita">Receita</option></select></label><label>Data<input class="field" type="date" name="date" value="${iso}" required></label><label class="full">Fornecedor ou descrição<input class="field" name="desc" maxlength="120" required></label><label>Categoria<select class="field" name="cat"><option>Água e esgoto</option><option>Energia das áreas comuns</option><option>Manutenção e reparos</option><option>Limpeza</option><option>Gás</option><option>Seguro</option><option>Taxas e impostos</option><option>Honorários</option><option>Obras</option><option>Taxa condominial</option><option>Fundo de reserva</option><option>Outras receitas</option><option>Outras despesas</option></select></label><label>Valor (R$)<input class="field" name="value" placeholder="0,00" inputmode="decimal" required></label><label>Número do documento (opcional)<input class="field" name="note"></label><label class="full">Observação (opcional)<input class="field" name="obs"></label><div class="full"><button class="btn">Salvar lançamento demonstrativo</button></div></form></div>`);document.getElementById('closeform').onclick=()=>document.getElementById('entryform').remove();document.getElementById('entryformdata').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),v=Number(String(f.get('value')).replace(/\./g,'').replace(',','.'));if(!(v>0)){alert('Informe um valor maior que zero.');return}entries.unshift({id:Date.now(),date:f.get('date'),type:f.get('type'),desc:String(f.get('desc')).trim(),cat:f.get('cat'),value:Math.round(v*100)/100,note:f.get('note'),obs:f.get('obs')});render()};}
function showVisitorNoticeForm(){const date=prompt('Data prevista (AAAA-MM-DD):',iso);if(!date)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return alert('Informe a data no formato AAAA-MM-DD.');const start=prompt('Horário inicial aproximado (HH:MM):','14:00');if(!start)return;const end=prompt('Horário final aproximado (HH:MM):','18:00');if(!end)return;const unit=prompt('Unidade responsável pelo aviso:','Unidade vinculada ao perfil')||'Unidade vinculada ao perfil';const note=prompt('Observação opcional:','')||'';visitorNotices.unshift({id:Date.now(),date,start,end,unit,note,status:'Aviso ativo'});render();alert('Aviso publicado nesta demonstração. Ele não constitui reserva nem garante a disponibilidade da vaga.');}
function showMaintenanceForm(){if(!isAdmin())return;const title=prompt('Nome da manutenção:');if(!title?.trim())return;const due=prompt('Próximo vencimento (AAAA-MM-DD):',dateOffset(30));if(!due||!/^\d{4}-\d{2}-\d{2}$/.test(due))return alert('Data inválida.');const intervalRaw=prompt('Periodicidade em meses (0 para serviço único):','6');const interval=Number(intervalRaw);if(!Number.isInteger(interval)||interval<0||interval>120)return alert('Informe intervalo inteiro entre 0 e 120 meses.');const provider=prompt('Prestador/responsável externo (opcional):','')||'';const notes=prompt('Observações e requisitos do serviço (opcional):','')||'';maintenanceTasks.push({id:Date.now(),title:title.trim(),category:'Manutenção preventiva',due,interval,responsible:'Síndico',provider,notes,status:'Agendada',history:[]});render();}
function editMaintenance(id){if(!isAdmin())return;const t=maintenanceTasks.find(x=>x.id===id);if(!t)return;const due=prompt('Próximo vencimento (AAAA-MM-DD):',t.due);if(!due||!/^\d{4}-\d{2}-\d{2}$/.test(due))return alert('Data inválida.');const intervalRaw=prompt('Periodicidade em meses (0 para serviço único):',String(t.interval));const interval=Number(intervalRaw);if(!Number.isInteger(interval)||interval<0||interval>120)return alert('Intervalo inválido.');t.due=due;t.interval=interval;t.provider=prompt('Prestador/responsável externo:',t.provider)||'';t.notes=prompt('Observações:',t.notes)||'';t.status='Agendada';render();}

/* ===== V1.6 — Financeiro alimentado pelas planilhas (data/financeiro.json, gerado por tools/importar_planilhas.py) ===== */
let FIN=null,finTab='previsao',finMonth=null;
(function(){const aplicar=j=>{if(!j||!j.meses)return;FIN=j;finMonth=(j.meses.find(m=>m.id===iso.slice(0,7))||j.meses[0]).id;if(page==='financeiro')render()};/* data/financeiro.js funciona ao abrir o arquivo direto no computador (file://); o fetch cobre a hospedagem em servidor */if(window.FINANCEIRO_DATA)aplicar(window.FINANCEIRO_DATA);else fetch('./data/financeiro.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(aplicar).catch(()=>{})})();
const pct=f=>(f*100).toFixed(5).replace('.',',')+'%',fdt=d=>d?d.split('-').reverse().join('/'):'—';
const financeCaixa=finance;
finance=function(){
 if(!FIN||!canFullFinance())return financeCaixa();
 const tabs=[['previsao','Previsão orçamentária'],['conciliacao','Conciliação bancária'],['caixa','Livro-caixa (demonstração)']];
 const m=FIN.meses.find(x=>x.id===finMonth);
 const bar=`${head('Financeiro','Dados importados das planilhas de previsão orçamentária e conciliação bancária.')}<div class="toolbar">${tabs.map(t=>`<button class="btn ${finTab===t[0]?'':'secondary'}" data-ftab="${t[0]}">${t[1]}</button>`).join('')}${finTab==='caixa'?'':`<select class="field" id="finmonth">${FIN.meses.map(x=>`<option value="${x.id}" ${x.id===finMonth?'selected':''}>${x.rotulo}</option>`).join('')}</select>`}</div>`;
 if(finTab==='caixa')return bar+financeCaixa().replace(/^<div class="heading">[\s\S]*?<\/p><\/div>(<button[^>]*>[^<]*<\/button>)?<\/div>/,'$1');
 const al=FIN.alertas.length?`<div class="notice"><strong>Pontos de atenção nas planilhas:</strong><br>${FIN.alertas.map(a=>'• '+a).join('<br>')}</div>`:'';
 return bar+al+(finTab==='previsao'?finPrevisao(m):finConciliacao(m))+`<div class="smallnote">Dados importados em ${FIN.gerado_em.replace('T',' ')}${FIN.nomes_mascarados?' · nomes de pessoas físicas omitidos':''}. Não publique data/financeiro.json em hospedagem aberta.</div>`;
};
function finPrevisao(m){
 const p=m.previsao,fr=Object.fromEntries(FIN.unidades.map(u=>[u.id,u])),fa=Object.fromEntries(p.agua.itens.map(i=>[i.unidade,i.fracao_ideal]));
 return `<div class="grid stats">${cardStat('Total previsto a cobrar',brl(p.total_previsto),'Soma das 8 unidades')}${cardStat('Despesas gerais',brl(p.total_despesas),'Taxa por unidade: '+brl(p.taxa_por_unidade))}${cardStat('Fatura de água',brl(p.agua.fatura),'Vencimento '+fdt(p.agua.vencimento))}${cardStat('Gás',brl(p.gas.total),brl(p.gas.preco_m3)+' por m³')}</div>
<div class="card"><div class="cardhead"><h2>Cobrança prevista por unidade</h2><span class="pill">${m.rotulo}</span></div><div class="tablewrap"><table><thead><tr><th>Unid.</th><th>Fração usada na água</th><th class="amount">Taxa</th><th class="amount">Fundo</th><th class="amount">Água</th><th class="amount">Gás</th><th class="amount">Parceladas</th><th class="amount">Comp.</th><th class="amount">Total</th></tr></thead><tbody>${p.cobranca.map(c=>`<tr><td><strong>${c.unidade}</strong></td><td>${pct(fa[c.unidade])}${Math.abs(fa[c.unidade]-fr[c.unidade].fracao_ideal)>1e-9?' <span class="pill amber">anterior</span>':''}</td><td class="amount">${brl(c.taxa)}</td><td class="amount">${brl(c.fundo_obras)}</td><td class="amount">${brl(c.agua)}</td><td class="amount">${brl(c.gas)}</td><td class="amount">${brl(c.parceladas)}</td><td class="amount">${c.compensacao?brl(c.compensacao):'—'}</td><td class="amount"><strong>${brl(c.total)}</strong></td></tr>`).join('')}</tbody></table></div></div>
<div class="grid cols"><section class="card"><div class="cardhead"><h2>Despesas gerais</h2></div><div class="list">${p.despesas.map(d=>`<div class="listrow"><div><div class="rowtitle">${d.descricao}</div><div class="rowmeta">Vencimento ${fdt(d.vencimento)}</div></div><div class="rowright"><strong>${brl(d.valor)}</strong></div></div>`).join('')}</div></section>
<section class="card"><div class="cardhead"><h2>Frações ideais cadastradas</h2><span class="pill green">Atualizadas</span></div><div class="tablewrap"><table><thead><tr><th>Unid.</th><th>Atual</th><th>Anterior</th></tr></thead><tbody>${FIN.unidades.map(u=>`<tr><td>${u.id}</td><td><strong>${u.fracao_ideal.toFixed(7).replace('.',',')}</strong></td><td class="muted">${u.fracao_anterior.toFixed(7).replace('.',',')}</td></tr>`).join('')}<tr><td><strong>Total</strong></td><td><strong>${FIN.unidades.reduce((s,u)=>s+u.fracao_ideal,0).toFixed(7).replace('.',',')}</strong></td><td class="muted">${FIN.unidades.reduce((s,u)=>s+u.fracao_anterior,0).toFixed(7).replace('.',',')}</td></tr></tbody></table></div></section></div>`}
function finConciliacao(m){
